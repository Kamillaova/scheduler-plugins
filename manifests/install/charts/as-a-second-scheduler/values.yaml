# Default values for scheduler-plugins-as-a-second-scheduler.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

scheduler:
  name: scheduler-plugins-scheduler
  image: registry.k8s.io/scheduler-plugins/kube-scheduler:v0.35.7
  command:
  - /bin/kube-scheduler
  replicaCount: 1
  leaderElect: true
  priorityClassName: ""
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # Extra kube-scheduler CLI arguments. Feature gates live here: the
  # KubeSchedulerConfiguration file has no featureGates field.
  # e.g. ["--feature-gates=DRAConsumableCapacity=true"]
  extraArgs: []

controller:
  # Serves the Coscheduling and ElasticQuota plugins, which need the
  # scheduling.x-k8s.io CRDs. Turn off for a scheduler running neither, so the
  # deployment does not require CRDs it never reads.
  enabled: true
  name: scheduler-plugins-controller
  image: registry.k8s.io/scheduler-plugins/controller:v0.35.7
  replicaCount: 1
  leaderElect: false
  priorityClassName: ""
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  projector:
    enabled: false
    driverNamespace: ""
    driverName: "dra.cpu"

# LoadVariationRiskBalancing and TargetLoadPacking are not enabled by default
# as they need extra RBAC privileges on metrics.k8s.io.

rbac:
  # Grant the scheduler the DRA write verbs the in-tree DynamicResources plugin
  # needs to allocate a claim at Reserve/PreBind: resourceclaims and their
  # status and binding subresources, plus pods/finalizers. Required by any
  # plugin that schedules DRA claims, CCXAlign among them. Off by default so a
  # deployment running only Coscheduling or CapacityScheduling is not handed
  # write access to every ResourceClaim in the cluster.
  dra: false

# Percentage of nodes to score in the profile. When unset or null, kube-scheduler uses its default.
# e.g. percentageOfNodesToScore: 100
percentageOfNodesToScore: null

plugins:
  enabled: ["Coscheduling","CapacityScheduling","NodeResourceTopologyMatch","NodeResourcesAllocatable"]
  disabled: ["PrioritySort"] # only in-tree plugins need to be defined here
  # Per-plugin score weights; the multiPoint list above cannot express them.
  # Names are used verbatim (no title-casing).
  # e.g. score: {enabled: [{name: CCXAlign, weight: 5}], disabled: [{name: ImageLocality}]}
  score: {}
  # Per-extension-point plugin configuration.
  # Any extension point (preEnqueue, queueSort, preFilter, filter, postFilter,
  # preScore, score, reserve, permit, preBind, bind, postBind, placementGenerate,
  # placementScore, podGroupPostFilter) can specify enabled and disabled lists.
  # Names are used verbatim. In score, entries may also include an optional weight.
  # e.g.
  # postFilter: {disabled: [{name: DefaultPreemption}]}
  # filter: {disabled: [{name: CCXAlign}]}

# Customize the enabled plugins' config.
# Refer to the "pluginConfig" section of manifests/<plugin>/scheduler-config.yaml.
# For example, for Coscheduling plugin, you want to customize the permit waiting timeout to 10 seconds:
pluginConfig:
- name: Coscheduling
  args:
    permitWaitingTimeSeconds: 10 # default is 60
# Or, customize the other plugins
# - name: NodeResourceTopologyMatch
#   args:
#     scoringStrategy:
#       type: MostAllocated # default is LeastAllocated
#- name: SySched
#  args:
#    defaultProfileNamespace: "default"
#    defaultProfileName: "full-seccomp"

# VM PriorityClass configuration.
# When enabled, ships a PriorityClass configured with preemptionPolicy: Never
# to protect VM workloads from being chosen as preemption victims while never
# preempting other pods itself.
priorityClass:
  enabled: false
  name: vm-priority
  value: 100000000

