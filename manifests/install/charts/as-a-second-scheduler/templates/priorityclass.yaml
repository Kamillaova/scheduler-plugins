{{- if and .Values.priorityClass .Values.priorityClass.enabled }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClass.name }}
value: {{ .Values.priorityClass.value | int }}
preemptionPolicy: Never
globalDefault: false
description: "High-priority non-preempting PriorityClass protecting VM workloads from scheduler preemption."
{{- end }}
